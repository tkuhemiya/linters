# Personal fallback for directories with no Ruff config of their own.
# Assumes Ruff 0.16+ (413 default rules). The list below is the extra set.
#
# A project ruff.toml, .ruff.toml, or [tool.ruff] table replaces this file.
# It does not merge with it.

[lint]
extend-select = [
    # raise inside except should name its cause. Still off in 0.16 defaults.
    "B904",
    # Unused parameters. A leading underscore is still allowed.
    "ARG",
    # Current syntax beyond the default UP subset. Honors target-version,
    # which is py310 unless the project says otherwise.
    "UP",
    # Group and sort imports beyond I001, which 0.16 already turns on.
    "I",
]
