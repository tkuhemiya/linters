# Personal fallback for directories with no ty config of their own.
# ty's defaults stay on. The rules below were ignored and are now enabled.
#
# A project ty.toml or [tool.ty] table is merged on top of this file.
# Where both set the same value, the project wins.

[rules]
# A generic in an annotation has to name its parameters: re.Match[str], not re.Match.
missing-type-argument = "error"
