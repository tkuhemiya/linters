# Shareable extra. ty has no extend; a project copies this rule, or this
# file is the user config at ~/.config/ty/ty.toml.
# ty's defaults stay on. A project ty.toml or [tool.ty] table merges on
# top; the project value wins.

[rules]
# A generic in an annotation has to name its parameters: re.Match[str], not re.Match.
missing-type-argument = "error"
